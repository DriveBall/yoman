<title>מתכון ליומן עם Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700&family=Rubik:wght@800&display=swap">
<style>
/* Layout: one thumb-friendly column. Pick, wait, fix, send, with the send action fixed at the bottom. */
:root{--bg:oklch(97% 0.005 250);--surface:oklch(100% 0.002 250);--well:oklch(92% 0.007 250);--ink:oklch(18% 0.08 260);--muted:oklch(42% 0.02 250);--line:oklch(70% 0.01 250);--accent:oklch(88% 0.20 120);--on:oklch(16% 0.08 260);--focus:oklch(50% 0.17 255);--display:"Rubik","Heebo",system-ui,sans-serif;--body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(22% 0.06 320);--surface:oklch(29% 0.07 320);--well:oklch(16% 0.05 320);--ink:oklch(98% 0.01 320);--muted:oklch(83% 0.03 320);--line:oklch(50% 0.07 320);--accent:oklch(80% 0.14 5);--on:oklch(22% 0.06 320);--focus:oklch(85% 0.12 5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:oklch(22% 0.06 320);--surface:oklch(29% 0.07 320);--well:oklch(16% 0.05 320);--ink:oklch(98% 0.01 320);--muted:oklch(83% 0.03 320);--line:oklch(50% 0.07 320);--accent:oklch(80% 0.14 5);--on:oklch(22% 0.06 320);--focus:oklch(85% 0.12 5);color-scheme:dark}
*{box-sizing:border-box}html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body)}
main{max-width:560px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:800 26px/1.15 var(--display);margin:0;overflow-wrap:break-word;min-width:0;text-wrap:balance}p{margin:0}.muted{color:var(--muted);font-size:15px}
.box{background:var(--surface);border-radius:24px;padding:16px;display:grid;gap:12px;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:16px;border:2px solid transparent;background:var(--accent);color:var(--on);font:700 18px var(--body);cursor:pointer;text-decoration:none;position:relative;overflow:hidden;width:100%;padding:0 12px;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.small{min-height:44px;font-size:16px}
.btn:disabled{background:var(--well);color:var(--muted);cursor:not-allowed}.btn[aria-disabled="true"]{background:var(--well);color:var(--muted);pointer-events:none}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.btn:focus-within,.btn:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.del:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img#prev{width:100%;max-height:200px;object-fit:cover;border-radius:16px;display:block}
label{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:700;min-width:0}
input[type=text],input[type=number],textarea{font:500 16px var(--body);color:var(--ink);background:var(--well);border:2px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;min-height:48px}
textarea{min-height:120px;resize:vertical}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}details[open]>summary{margin-bottom:4px}
#msg{min-height:24px}#msg:empty{display:none}
.busy{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:16px}
.dock{position:fixed;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));z-index:5}.dock>*{max-width:528px;margin-inline:auto}
ul{margin:0;padding-inline-start:20px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ing{background:var(--well);border-radius:16px;padding:8px;display:grid;gap:8px}.ing input{background:var(--surface)}.inghead{display:grid;grid-template-columns:minmax(0,1fr) 88px 44px;gap:8px;align-items:end}
.del{appearance:none;border:0;background:transparent;color:var(--ink);font-size:24px;min-width:44px;min-height:44px;cursor:pointer}
#ings{display:grid;gap:8px}.ing summary{font-size:14px;color:var(--muted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;display:block}.thumbs button{position:absolute;inset:-6px -6px auto auto;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:16px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--well);border-radius:999px;padding:4px}.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:700 16px var(--body);min-height:44px;border-radius:999px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.q{background:var(--well);border-radius:16px;padding:12px;display:grid;gap:8px}
.tot{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;min-height:44px;font-weight:700;color:var(--ink);font-size:16px}.check input{width:24px;height:24px;accent-color:var(--accent)}
</style>
<main dir="rtl" lang="he"><section class="box"><h1>העמוד עבר</h1><p class="muted">מתכונים, ארוחות וצילומים נרשמים עכשיו בעמוד אחד.</p><a class="btn" href="https://claude.ai/artifact/SJ29RfbqxbbN9kdiLwrpZN" target="_blank" rel="noopener">לספר ל־Claude</a></section></main>
